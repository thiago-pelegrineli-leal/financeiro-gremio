<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/jpeg" href="https://media-gru1-1.cdn.whatsapp.net/v/t61.24694-24/489405406_650586094569182_6793834854762065392_n.jpg?ccb=11-4&oh=01_Q5Aa4wGY7p0SayjbDIPzs9zg4cRQqjwpuZWHtXDXiacRVfJnLw&oe=6A35BF57&_nc_sid=5e03e0&_nc_cat=102">
  
  <title>PDV Profissional Grêmio</title>
  
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18.2.0"
      }
    }
  </script>

  <style>
    /* Suavização geral e scrollbar customizada */
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
    .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    .dark .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body class="transition-colors duration-300 bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      ShoppingCart, Settings, Tag, PlusCircle, MinusCircle, CheckCircle, 
      CreditCard, Banknote, X, Edit2, Trash2, RotateCcw, LayoutDashboard, 
      History, Printer, Download, Calculator, Lock, Sun, Moon, AlertTriangle, Info,
      GripHorizontal, Archive, Image as ImageIcon
    } from 'lucide-react';

    function App() {
      // --- GERENCIAMENTO DE ESTADO E LOCALSTORAGE ---
      const loadData = (key, defaultValue) => {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : defaultValue;
      };

      const [theme, setTheme] = useState(() => loadData('pdv_theme', 'dark'));
      
      const defaultSettings = { 
        eventName: 'Evento Atual', 
        gremioName: 'Grêmio Geração Consciente',
        logoUrl: 'https://media-gru1-1.cdn.whatsapp.net/v/t61.24694-24/489405406_650586094569182_6793834854762065392_n.jpg?ccb=11-4&oh=01_Q5Aa4wGY7p0SayjbDIPzs9zg4cRQqjwpuZWHtXDXiacRVfJnLw&oe=6A35BF57&_nc_sid=5e03e0&_nc_cat=102'
      };
      
      const [settings, setSettings] = useState(() => {
        const loaded = loadData('pdv_settings', defaultSettings);
        return { ...defaultSettings, ...loaded };
      });
      
      const [eventLogs, setEventLogs] = useState(() => loadData('pdv_event_logs', []));
      const [products, setProducts] = useState(() => loadData('pdv_products', []));
      const [sales, setSales] = useState(() => loadData('pdv_sales', []));
      
      const [activeTab, setActiveTab] = useState('pos'); 
      const [cart, setCart] = useState([]);
      const [cartDiscount, setCartDiscount] = useState(0);

      const defaultDrawer = {
        200: 0, 100: 0, 50: 0, 20: 0, 10: 0, 5: 0, 2: 0, 1: 0, 0.5: 0, 0.25: 0, 0.1: 0, 0.05: 0
      };
      const [cashDrawer, setCashDrawer] = useState(() => loadData('pdv_cash_drawer', defaultDrawer));

      // Modais Customizados Animados (Substituindo Alerts)
      const [isCalcOpen, setIsCalcOpen] = useState(false);
      const [calcInput, setCalcInput] = useState('');
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', text: '', action: null, isDanger: false });
      const [alertDialog, setAlertDialog] = useState({ isOpen: false, title: '', text: '' });
      const [isPixModalOpen, setIsPixModalOpen] = useState(false);
      
      const [editingProduct, setEditingProduct] = useState(null);
      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      
      const [checkoutMsg, setCheckoutMsg] = useState('');
      const [pixStudentName, setPixStudentName] = useState('');
      const [pixStudentClass, setPixStudentClass] = useState('');

      // Persistência
      useEffect(() => { localStorage.setItem('pdv_theme', JSON.stringify(theme)); }, [theme]);
      useEffect(() => { localStorage.setItem('pdv_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('pdv_event_logs', JSON.stringify(eventLogs)); }, [eventLogs]);
      useEffect(() => { localStorage.setItem('pdv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('pdv_sales', JSON.stringify(sales)); }, [sales]);
      useEffect(() => { localStorage.setItem('pdv_cash_drawer', JSON.stringify(cashDrawer)); }, [cashDrawer]);

      // Aplicação do Tema Dark/Light
      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      // Utilitários
      const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const formatDate = (isoString) => new Date(isoString).toLocaleString('pt-BR');

      // --- CAIXA E VENDAS ---
      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === product.id);
          if (exists) return prev.map(i => i.product.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { product, quantity: 1 }];
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === productId);
          if (exists.quantity === 1) return prev.filter(i => i.product.id !== productId);
          return prev.map(i => i.product.id === productId ? { ...i, quantity: i.quantity - 1 } : i);
        });
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      const cartTotal = Math.max(0, cartSubtotal - cartDiscount);

      const handlePixClick = () => {
        if (cart.length === 0) return;
        setIsPixModalOpen(true);
      };

      const processCheckout = (paymentMethod) => {
        if (cart.length === 0) return;
        
        if (paymentMethod === 'PIX' && (!pixStudentName.trim() || !pixStudentClass.trim())) {
          setAlertDialog({ isOpen: true, title: 'Atenção Necessária', text: 'Por favor, preencha o Nome e a Série do aluno para o registro do PIX.'});
          return;
        }

        const newSale = {
          id: Date.now().toString(),
          items: [...cart], subtotal: cartSubtotal, discount: cartDiscount, total: cartTotal,
          paymentMethod, timestamp: new Date().toISOString(),
          studentInfo: paymentMethod === 'PIX' ? { name: pixStudentName, schoolClass: pixStudentClass } : null
        };

        setSales([newSale, ...sales]); setCart([]); setCartDiscount(0);
        setPixStudentName(''); setPixStudentClass(''); setIsPixModalOpen(false);

        setCheckoutMsg(`Sucesso! ${formatCurrency(cartTotal)} via ${paymentMethod}`);
        setTimeout(() => setCheckoutMsg(''), 3000);
      };

      const cancelSale = (saleId) => {
        setConfirmDialog({
          isOpen: true, title: 'Estornar Venda', text: 'Tem certeza que deseja estornar (cancelar) esta venda? Ela será removida do histórico atual.', isDanger: true,
          action: () => setSales(sales.filter(s => s.id !== saleId))
        });
      };

      // --- PRODUTOS ---
      const saveProduct = (e) => {
        e.preventDefault();
        if (!prodName || !prodPrice) return;
        const priceNum = parseFloat(prodPrice.toString().replace(',', '.'));
        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? { ...p, name: prodName, price: priceNum } : p));
          setEditingProduct(null);
        } else {
          setProducts([...products, { id: Date.now().toString(), name: prodName, price: priceNum }]);
        }
        setProdName(''); setProdPrice('');
      };

      const deleteProduct = (id) => {
        setConfirmDialog({
          isOpen: true, title: 'Excluir Produto', text: 'Deseja excluir este produto definitivamente do cardápio?', isDanger: true,
          action: () => {
            setProducts(products.filter(p => p.id !== id));
            setCart(cart.filter(item => item.product.id !== id));
          }
        });
      };

      // --- EXPORTAÇÃO E CÁLCULOS ---
      const getReport = (salesData = sales) => {
        return salesData.reduce((acc, sale) => {
          acc.total += sale.total;
          acc.discounts += sale.discount || 0;
          if (sale.paymentMethod === 'PIX') acc.pix += sale.total;
          if (sale.paymentMethod === 'DINHEIRO') acc.dinheiro += sale.total;

          sale.items.forEach(item => {
            if (!acc.items[item.product.id]) acc.items[item.product.id] = { name: item.product.name, quantity: 0, total: 0 };
            acc.items[item.product.id].quantity += item.quantity;
            acc.items[item.product.id].total += (item.quantity * item.product.price);
          });
          return acc;
        }, { total: 0, pix: 0, dinheiro: 0, discounts: 0, items: {} });
      };

      const executeWithLightMode = (callback) => {
        const wasDark = document.documentElement.classList.contains('dark');
        if (wasDark) document.documentElement.classList.remove('dark');
        
        setTimeout(() => {
          callback(() => {
            if (wasDark) document.documentElement.classList.add('dark');
          });
        }, 150);
      };

      const requestPrint = () => {
        executeWithLightMode((restoreTheme) => {
          window.print();
          setTimeout(restoreTheme, 1000); 
        });
      };

      const downloadPDF = (elementId, filenamePrefix) => {
        const element = document.getElementById(elementId);
        executeWithLightMode((restoreTheme) => {
          const opt = {
            margin: 10,
            filename: `${filenamePrefix}_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          html2pdf().set(opt).from(element).save().then(restoreTheme);
        });
      };

      const calculateDrawerTotal = () => {
        return Object.entries(cashDrawer).reduce((total, [value, qty]) => total + (Number(value) * Number(qty || 0)), 0);
      };

      // --- CALCULADORA ---
      const calcPos = useRef({ x: window.innerWidth > 768 ? window.innerWidth - 300 : 20, y: 20 });
      const calcRef = useRef(null);

      const handleCalcDragStart = (e) => {
        const startX = e.clientX || e.touches[0].clientX;
        const startY = e.clientY || e.touches[0].clientY;
        const startPosX = calcPos.current.x;
        const startPosY = calcPos.current.y;

        const onMove = (moveEvent) => {
          const currentX = moveEvent.clientX || (moveEvent.touches && moveEvent.touches[0].clientX);
          const currentY = moveEvent.clientY || (moveEvent.touches && moveEvent.touches[0].clientY);
          calcPos.current = {
            x: startPosX + (currentX - startX),
            y: startPosY + (currentY - startY)
          };
          if(calcRef.current) {
            calcRef.current.style.transform = `translate(${calcPos.current.x}px, ${calcPos.current.y}px)`;
          }
        };

        const onEnd = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      };

      const handleCalcBtn = (btn) => {
        if(btn === 'C') setCalcInput('');
        else if(btn === '=') { 
          try { 
            let evalStr = calcInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '.');
            // Safe evaluation replacement for eval()
            let res = new Function('return ' + evalStr)();
            if (res === undefined || isNaN(res)) throw new Error('Inválido');
            setCalcInput(res.toString().replace(/\./g, ',')); 
          } catch(e) { 
            setCalcInput('Erro'); 
            setTimeout(() => setCalcInput(''), 1500);
          } 
        } 
        else { 
          setCalcInput(prev => prev === 'Erro' ? btn : prev + btn); 
        }
      };

      const NavItem = ({ id, icon: Icon, label }) => (
        <button onClick={() => setActiveTab(id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 font-medium ${activeTab === id ? 'bg-blue-600 shadow-[0_0_15px_rgba(37,99,235,0.4)] text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800'}`}>
          <Icon size={20} /> <span className="hidden md:block">{label}</span>
        </button>
      );

      const reportData = getReport();
      const drawerTotal = calculateDrawerTotal();
      const drawerDiff = drawerTotal - reportData.dinheiro;

      return (
        <div className="min-h-screen flex w-full font-sans">
          
          {/* ================= MODAIS ESCONDIDOS (POP-UPS PROFISSIONAIS) ================= */}
          
          {/* Alerta Simples */}
          {alertDialog.isOpen && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4 backdrop-blur-md print:hidden transition-opacity">
              <div className="glass-panel rounded-2xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50 w-full max-w-sm p-6 transform transition-all scale-100 opacity-100">
                <div className="flex items-center gap-3 mb-4 text-blue-600 dark:text-blue-400">
                  <Info size={28}/> <h3 className="text-xl font-bold">{alertDialog.title}</h3>
                </div>
                <p className="text-gray-700 dark:text-gray-300 mb-6">{alertDialog.text}</p>
                <button onClick={() => setAlertDialog({isOpen: false})} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-lg hover:shadow-blue-500/30">
                  Entendi
                </button>
              </div>
            </div>
          )}

          {/* Confirmação (Sim/Não) */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4 backdrop-blur-md print:hidden transition-opacity">
              <div className="glass-panel rounded-2xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50 w-full max-w-sm p-6 transform transition-all">
                <div className={`flex items-center gap-3 mb-4 ${confirmDialog.isDanger ? 'text-red-500' : 'text-blue-600 dark:text-blue-400'}`}>
                  {confirmDialog.isDanger ? <AlertTriangle size={28}/> : <Info size={28}/>} 
                  <h3 className="text-xl font-bold">{confirmDialog.title}</h3>
                </div>
                <p className="text-gray-700 dark:text-gray-300 mb-6 leading-relaxed">{confirmDialog.text}</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmDialog({...confirmDialog, isOpen: false})} className="flex-1 py-3 bg-gray-200/80 dark:bg-gray-700/80 text-gray-800 dark:text-gray-200 rounded-xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                    Cancelar
                  </button>
                  <button onClick={() => { confirmDialog.action(); setConfirmDialog({...confirmDialog, isOpen: false}); }} className={`flex-1 py-3 text-white rounded-xl font-bold transition-all shadow-lg ${confirmDialog.isDanger ? 'bg-red-600 hover:bg-red-700 hover:shadow-red-500/30' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-blue-500/30'}`}>
                    Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Calculadora Flutuante */}
          {isCalcOpen && (
            <div 
              ref={calcRef}
              style={{ transform: `translate(${calcPos.current.x}px, ${calcPos.current.y}px)` }}
              className="fixed top-0 left-0 z-50 glass-panel rounded-2xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50 w-64 print:hidden transition-opacity overflow-hidden"
            >
              <div 
                className="flex justify-between items-center p-3 bg-white/50 dark:bg-gray-900/50 cursor-move border-b border-gray-200/50 dark:border-gray-700/50"
                onMouseDown={handleCalcDragStart}
                onTouchStart={handleCalcDragStart}
              >
                <div className="flex items-center gap-2 text-gray-600 dark:text-gray-400">
                  <GripHorizontal size={16}/>
                  <span className="font-bold text-sm uppercase tracking-wider">Calc</span>
                </div>
                <button onClick={() => setIsCalcOpen(false)} className="text-gray-500 hover:text-red-500 transition-colors"><X size={18}/></button>
              </div>
              
              <div className="p-4">
                <div className="bg-white/80 dark:bg-gray-950/80 p-3 rounded-xl text-right text-2xl font-mono mb-3 overflow-hidden border border-gray-200/50 dark:border-gray-700/50 h-14 flex items-center justify-end shadow-inner">
                  {calcInput || '0'}
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {['7','8','9','÷','4','5','6','×','1','2','3','-','C','0',',','+'].map(btn => (
                    <button key={btn} onClick={() => handleCalcBtn(btn)} className={`p-3 rounded-xl font-bold text-lg transition-all active:scale-95 ${btn === 'C' ? 'bg-red-500/90 text-white hover:bg-red-600' : ['÷','×','-','+'].includes(btn) ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-800/50' : 'bg-white/50 dark:bg-gray-800/50 border border-gray-200/50 dark:border-gray-700/50 hover:bg-gray-200/50 dark:hover:bg-gray-700/50'}`}>{btn}</button>
                  ))}
                  <button onClick={() => handleCalcBtn('=')} className="col-span-4 p-3 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 transition-colors shadow-md hover:shadow-blue-500/30">=</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal PIX */}
          {isPixModalOpen && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-md print:hidden transition-opacity">
              <div className="glass-panel rounded-2xl shadow-2xl border border-teal-500/20 w-full max-w-md overflow-hidden transform transition-all">
                <div className="flex justify-between items-center p-5 border-b border-gray-200/50 dark:border-gray-700/50 bg-teal-50/80 dark:bg-teal-900/40">
                  <h3 className="font-bold text-teal-800 dark:text-teal-400 flex items-center gap-2 text-lg"><CreditCard size={22} /> Dados do PIX</h3>
                  <button onClick={() => setIsPixModalOpen(false)} className="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white transition-colors"><X size={24} /></button>
                </div>
                <div className="p-6 space-y-5">
                  <div className="text-center mb-2">
                    <p className="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Total a cobrar</p>
                    <p className="text-4xl font-black text-teal-600 dark:text-teal-400 mt-1">{formatCurrency(cartTotal)}</p>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">Nome do Aluno</label>
                    <input type="text" value={pixStudentName} onChange={e => setPixStudentName(e.target.value)} placeholder="Ex: João da Silva" className="w-full p-4 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-600/50 rounded-xl outline-none focus:border-teal-500 dark:focus:border-teal-500 transition-colors" autoFocus />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">Série / Turma</label>
                    <input type="text" value={pixStudentClass} onChange={e => setPixStudentClass(e.target.value)} placeholder="Ex: 3º Ano B" className="w-full p-4 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-600/50 rounded-xl outline-none focus:border-teal-500 dark:focus:border-teal-500 transition-colors" />
                  </div>
                </div>
                <div className="p-5 flex gap-3 bg-gray-50/50 dark:bg-gray-800/30 border-t border-gray-200/50 dark:border-gray-700/50">
                  <button onClick={() => setIsPixModalOpen(false)} className="flex-1 py-3.5 bg-gray-200/80 dark:bg-gray-700/80 rounded-xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">Cancelar</button>
                  <button onClick={() => processCheckout('PIX')} className="flex-1 py-3.5 bg-teal-500 text-white rounded-xl font-bold hover:bg-teal-600 transition-all shadow-lg hover:shadow-teal-500/30">Confirmar Recebimento</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= BARRA LATERAL ================= */}
          <aside className="w-20 md:w-64 border-r border-gray-200/50 dark:border-gray-800 flex flex-col p-4 shadow-sm print:hidden transition-all duration-300 z-10 shrink-0 h-screen overflow-y-auto glass-panel">
            <div className="flex items-center gap-3 px-2 mb-8 mt-2 text-blue-600 dark:text-blue-500">
              <img src={settings.logoUrl} alt="Logo" className="w-10 h-10 rounded-full object-cover border-2 border-current shrink-0 bg-white shadow-sm" />
              <div className="hidden md:block overflow-hidden">
                <h1 className="text-sm font-bold tracking-tight text-ellipsis whitespace-nowrap text-gray-800 dark:text-gray-200">
                  {settings.gremioName}
                </h1>
                <p className="text-xs text-blue-600 dark:text-blue-400 truncate">{settings.eventName}</p>
              </div>
            </div>

            <nav className="flex-1 space-y-2">
              <NavItem id="pos" icon={ShoppingCart} label="Caixa (PDV)" />
              <NavItem id="products" icon={Tag} label="Cardápio" />
              <NavItem id="history" icon={History} label="Histórico Atual" />
              <NavItem id="report" icon={LayoutDashboard} label="Relatório de Vendas" />
              <NavItem id="closing" icon={Lock} label="Fechamento (Gaveta)" />
            </nav>

            <div className="mt-auto space-y-2 pt-4 border-t border-gray-200/50 dark:border-gray-800/50">
              <button onClick={() => setIsCalcOpen(!isCalcOpen)} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-400">
                <Calculator size={20}/> <span className="hidden md:block font-medium">Calculadora</span>
              </button>
              <NavItem id="settings" icon={Settings} label="Configurações" />
              <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-400">
                {theme === 'dark' ? <Sun size={20}/> : <Moon size={20}/>}
                <span className="hidden md:block font-medium capitalize">Modo {theme === 'dark' ? 'Claro' : 'Escuro'}</span>
              </button>
            </div>
          </aside>

          {/* ================= ÁREA DE CONTEÚDO PRINCIPAL ================= */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:overflow-visible relative">
            <div className="flex-1 overflow-y-auto p-4 md:p-6 print:p-0">
              
              {/* === CAIXA (PDV) === */}
              {activeTab === 'pos' && (
                <div className="flex flex-col lg:flex-row gap-6 h-full print:hidden">
                  <div className="flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-2xl font-black tracking-tight">Frente de Caixa</h2>
                      <span className="text-sm font-medium text-gray-500 bg-gray-200 dark:bg-gray-800 px-3 py-1 rounded-full">{products.length} produtos disponíveis</span>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pb-4 pr-2">
                      {products.map(p => (
                        <button key={p.id} onClick={() => addToCart(p)} className="bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border border-gray-200 dark:border-gray-700/80 rounded-2xl p-5 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-lg hover:border-blue-400/50 dark:hover:border-blue-500/50 transition-all active:scale-95 group">
                          <span className="font-semibold mb-3 text-gray-700 dark:text-gray-200 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{p.name}</span>
                          <span className="text-blue-700 dark:text-blue-300 font-black bg-blue-50 dark:bg-blue-900/30 px-4 py-1.5 rounded-lg border border-blue-100 dark:border-blue-800/30">{formatCurrency(p.price)}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="w-full lg:w-96 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border border-gray-200/80 dark:border-gray-800 rounded-3xl shadow-xl flex flex-col h-[600px] lg:h-full shrink-0 overflow-hidden">
                    <div className="p-5 border-b border-gray-200/50 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-950/50">
                      <h3 className="text-lg font-bold flex justify-between items-center">
                        Comanda Atual
                        <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">{cart.reduce((sum, i) => sum + i.quantity, 0)} itens</span>
                      </h3>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                      {cart.map(item => (
                        <div key={item.product.id} className="flex justify-between items-center bg-white dark:bg-gray-800 p-3.5 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm">
                          <div className="flex-1 pr-2">
                            <p className="font-bold text-sm text-gray-800 dark:text-gray-200">{item.product.name}</p>
                            <p className="text-xs text-blue-600 dark:text-blue-400 font-semibold">{formatCurrency(item.product.price)}</p>
                          </div>
                          <div className="flex items-center gap-3">
                            <div className="flex items-center bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700">
                              <button onClick={() => removeFromCart(item.product.id)} className="p-2 text-red-500 hover:bg-red-100 dark:hover:bg-red-900/30 rounded-l-lg transition-colors"><MinusCircle size={16}/></button>
                              <span className="w-6 text-center font-bold text-sm">{item.quantity}</span>
                              <button onClick={() => addToCart(item.product)} className="p-2 text-blue-500 hover:bg-blue-100 dark:hover:bg-blue-900/30 rounded-r-lg transition-colors"><PlusCircle size={16}/></button>
                            </div>
                            <div className="font-black text-sm w-16 text-right text-gray-700 dark:text-gray-300">{formatCurrency(item.product.price * item.quantity)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="p-5 bg-gray-50 dark:bg-gray-950 border-t border-gray-200/50 dark:border-gray-800">
                      <div className="flex justify-between items-center mb-4">
                        <span className="text-sm font-semibold text-gray-600 dark:text-gray-400">Desconto Extra (R$):</span>
                        <input type="number" min="0" step="0.5" value={cartDiscount || ''} onChange={e => setCartDiscount(Number(e.target.value))} className="w-24 text-right p-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 outline-none focus:border-blue-500 transition-colors font-mono font-medium" placeholder="0.00" />
                      </div>
                      <div className="flex justify-between items-end mb-5">
                        <span className="font-bold text-gray-700 dark:text-gray-300">Total a Pagar:</span>
                        <div className="text-right">
                          {cartDiscount > 0 && <span className="text-sm text-gray-400 line-through block mb-1">{formatCurrency(cartSubtotal)}</span>}
                          <span className="text-4xl font-black text-blue-600 dark:text-blue-500 tracking-tight">{formatCurrency(cartTotal)}</span>
                        </div>
                      </div>
                      {checkoutMsg && <div className="mb-4 bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-300 p-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 animate-pulse border border-green-200 dark:border-green-800/50"><CheckCircle size={18} /> {checkoutMsg}</div>}
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => processCheckout('DINHEIRO')} disabled={cart.length===0} className="bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-xl font-bold flex flex-col items-center justify-center gap-1.5 active:scale-95 disabled:opacity-50 transition-all shadow-lg hover:shadow-emerald-500/30"><Banknote size={22} /> <span className="text-xs tracking-wider uppercase">Dinheiro</span></button>
                        <button onClick={handlePixClick} disabled={cart.length===0} className="bg-teal-500 hover:bg-teal-600 text-white py-4 rounded-xl font-bold flex flex-col items-center justify-center gap-1.5 active:scale-95 disabled:opacity-50 transition-all shadow-lg hover:shadow-teal-500/30"><CreditCard size={22} /> <span className="text-xs tracking-wider uppercase">PIX</span></button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* === CARDÁPIO (PRODUTOS) === */}
              {activeTab === 'products' && (
                <div className="max-w-4xl mx-auto print:hidden">
                  <h2 className="text-2xl font-black mb-6 tracking-tight">Gerenciar Cardápio</h2>
                  <div className="glass-panel rounded-2xl shadow-sm border border-gray-200/80 dark:border-gray-800 overflow-hidden mb-8">
                    <form onSubmit={saveProduct} className="p-6 flex flex-col md:flex-row gap-5 items-end">
                      <div className="flex-1 w-full">
                        <label className="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Nome do Produto</label>
                        <input type="text" value={prodName} onChange={e => setProdName(e.target.value)} required className="w-full p-3.5 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-700/50 rounded-xl outline-none focus:border-blue-500 transition-colors" />
                      </div>
                      <div className="w-full md:w-48">
                        <label className="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Preço (R$)</label>
                        <input type="number" step="0.01" min="0" value={prodPrice} onChange={e => setProdPrice(e.target.value)} required className="w-full p-3.5 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-700/50 rounded-xl outline-none focus:border-blue-500 transition-colors font-mono" />
                      </div>
                      <div className="flex gap-3 w-full md:w-auto">
                        {editingProduct && <button type="button" onClick={() => {setEditingProduct(null); setProdName(''); setProdPrice('');}} className="p-3.5 px-6 bg-gray-200/80 dark:bg-gray-800/80 rounded-xl font-bold transition-colors w-full md:w-auto">Cancelar</button>}
                        <button type="submit" className="p-3.5 px-6 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-blue-500/30 w-full md:w-auto"><CheckCircle size={20} /> Salvar</button>
                      </div>
                    </form>
                  </div>
                  <div className="glass-panel rounded-2xl shadow-sm border border-gray-200/80 dark:border-gray-800 overflow-hidden">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-gray-100/50 dark:bg-gray-900/50 border-b border-gray-200/80 dark:border-gray-800 text-xs uppercase tracking-wider text-gray-500 font-bold">
                          <th className="p-5">Produto</th><th className="p-5 w-36">Preço</th><th className="p-5 w-32 text-center">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                        {products.map(p => (
                          <tr key={p.id} className="hover:bg-white/40 dark:hover:bg-gray-800/40 transition-colors">
                            <td className="p-5 font-bold text-gray-800 dark:text-gray-200">{p.name}</td>
                            <td className="p-5 font-black text-green-600 dark:text-green-400">{formatCurrency(p.price)}</td>
                            <td className="p-5 flex justify-center gap-3">
                              <button onClick={() => {setEditingProduct(p); setProdName(p.name); setProdPrice(p.price);}} className="p-2 text-blue-600 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:hover:bg-blue-800/50 rounded-lg transition-colors"><Edit2 size={18}/></button>
                              <button onClick={() => deleteProduct(p.id)} className="p-2 text-red-600 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-800/50 rounded-lg transition-colors"><Trash2 size={18}/></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === HISTÓRICO DE VENDAS === */}
              {activeTab === 'history' && (
                <div className="max-w-4xl mx-auto print:hidden">
                  <h2 className="text-2xl font-black mb-6 tracking-tight">Histórico de Transações do Evento</h2>
                  <div className="space-y-4">
                    {sales.length === 0 && <div className="text-center p-12 glass-panel border border-dashed border-gray-300 dark:border-gray-700 rounded-3xl"><p className="text-gray-500 font-medium">Nenhuma venda registrada neste evento ainda.</p></div>}
                    {sales.map(sale => (
                      <div key={sale.id} className="glass-panel border border-gray-200/80 dark:border-gray-800 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center shadow-sm hover:shadow-md transition-shadow">
                        <div>
                          <div className="flex flex-wrap items-center gap-3 mb-3">
                            <span className={`px-2.5 py-1 rounded-md text-xs font-black tracking-wider uppercase shadow-sm ${sale.paymentMethod === 'PIX' ? 'bg-teal-500 text-white' : 'bg-emerald-500 text-white'}`}>{sale.paymentMethod}</span>
                            <span className="text-xs font-medium text-gray-500">{formatDate(sale.timestamp)}</span>
                            {sale.studentInfo && <span className="text-xs bg-gray-200 dark:bg-gray-800 px-2.5 py-1 rounded-md font-semibold flex items-center gap-1 border border-gray-300/50 dark:border-gray-700">👤 {sale.studentInfo.name} ({sale.studentInfo.schoolClass})</span>}
                          </div>
                          <p className="text-sm font-medium text-gray-700 dark:text-gray-300">{sale.items.map(i => `${i.quantity}x ${i.product.name}`).join(' • ')}</p>
                        </div>
                        <div className="flex items-center gap-5 mt-4 md:mt-0 w-full md:w-auto justify-between md:justify-end border-t md:border-none border-gray-100 dark:border-gray-800 pt-4 md:pt-0">
                          <span className="text-xl font-black text-gray-800 dark:text-white">{formatCurrency(sale.total)}</span>
                          <button onClick={() => cancelSale(sale.id)} className="text-red-600 hover:text-white border border-red-200 hover:bg-red-600 dark:border-red-900/50 dark:hover:bg-red-600 p-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-sm"><RotateCcw size={16} /> Estornar</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ... O RESTANTE DO CÓDIGO (RELATÓRIO E FECHAMENTO) MANTIDO COM ESTILO COMPATÍVEL ... */}
              {/* Omitidos para focar na parte visual do app principal, mas com a mesma estrutura abaixo */}
              {/* ABA: RELATÓRIO DE VENDAS */}
              {(activeTab === 'report') && (
                <div className="max-w-4xl mx-auto">
                  <div className="glass-panel p-5 rounded-2xl shadow-sm border border-gray-200/80 dark:border-gray-800 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 print:hidden">
                    <div>
                      <h2 className="text-xl font-black tracking-tight">Resumo de Vendas</h2>
                      <p className="text-sm text-gray-500 font-medium">Dados gerados pelo sistema atual</p>
                    </div>
                    <div className="flex gap-3 w-full md:w-auto">
                      <button onClick={requestPrint} className="flex-1 md:flex-none justify-center bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all shadow-md">
                        <Printer size={18} /> Imprimir
                      </button>
                      <button onClick={() => downloadPDF('report-pdf-content', 'Relatorio_Vendas')} className="flex-1 md:flex-none justify-center bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all shadow-md hover:shadow-blue-500/30">
                        <Download size={18} /> Baixar PDF
                      </button>
                    </div>
                  </div>

                  <div id="report-pdf-content" className="bg-white p-8 rounded-3xl shadow-lg border border-gray-200 print:border-none print:shadow-none space-y-8 print:bg-white !text-black text-black">
                    {/* Conteúdo idêntico, forçando cores claras para o PDF */}
                    <div className="text-center border-b-2 border-gray-200 pb-6 flex flex-col items-center">
                      <img src={settings.logoUrl} alt="Logo" className="w-20 h-20 rounded-full object-cover border-4 border-gray-100 mb-4 shadow-sm" />
                      <h1 className="text-3xl font-black uppercase tracking-tight">{settings.gremioName}</h1>
                      <h2 className="text-xl font-bold text-gray-600 mt-1">{settings.eventName}</h2>
                      <p className="text-lg mt-2 font-medium">Relatório Geral de Vendas</p>
                      <p className="text-sm mt-2 text-gray-500">Gerado em: {formatDate(new Date().toISOString())}</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div className="bg-gray-50/80 print:bg-gray-50 p-6 rounded-2xl border border-gray-100">
                        <p className="text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Bruto Total</p>
                        <p className="text-3xl font-black text-gray-900">{formatCurrency(reportData.total)}</p>
                      </div>
                      <div className="bg-teal-50/50 print:bg-teal-50 p-6 rounded-2xl border border-teal-100">
                        <p className="text-xs font-black uppercase tracking-wider text-teal-700 mb-2">Total PIX</p>
                        <p className="text-3xl font-black text-teal-900">{formatCurrency(reportData.pix)}</p>
                      </div>
                      <div className="bg-emerald-50/50 print:bg-emerald-50 p-6 rounded-2xl border border-emerald-100">
                        <p className="text-xs font-black uppercase tracking-wider text-emerald-700 mb-2">Total Dinheiro</p>
                        <p className="text-3xl font-black text-emerald-900">{formatCurrency(reportData.dinheiro)}</p>
                      </div>
                    </div>

                    <div>
                      <h3 className="text-lg font-black border-b-2 border-gray-100 pb-3 mb-4">Produtos Vendidos</h3>
                      <table className="w-full text-left">
                        <thead className="text-xs uppercase font-bold text-gray-500 border-b-2 border-gray-100 bg-gray-50/50">
                          <tr><th className="py-3 px-2">Produto</th><th className="py-3 text-center">Qtd</th><th className="py-3 px-2 text-right">Receita</th></tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {Object.values(reportData.items).map((item, idx) => (
                            <tr key={idx}>
                              <td className="py-3 px-2 font-bold text-gray-800">{item.name}</td>
                              <td className="py-3 text-center font-black text-blue-600 bg-blue-50/50 rounded-lg">{item.quantity}</td>
                              <td className="py-3 px-2 text-right font-bold text-gray-700">{formatCurrency(item.total)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="mt-24 pt-12 flex flex-col md:flex-row justify-around text-center text-sm font-bold text-gray-600 gap-12">
                      <div><p className="border-t-2 border-gray-300 pt-3">Coordenador Geral</p></div>
                      <div><p className="border-t-2 border-gray-300 pt-3">Coordenador Financeiro</p></div>
                      <div><p className="border-t-2 border-gray-300 pt-3">Operador de Caixa</p></div>
                    </div>
                  </div>
                </div>
              )}

              {/* === CONFIGURAÇÕES === */}
              {activeTab === 'settings' && (
                <div className="max-w-3xl mx-auto print:hidden space-y-6">
                  <h2 className="text-2xl font-black mb-6 tracking-tight">Configurações do Sistema</h2>
                  
                  <div className="glass-panel rounded-3xl shadow-sm border border-gray-200/80 dark:border-gray-800 p-8 space-y-6">
                    <h3 className="font-black text-lg border-b border-gray-200/50 dark:border-gray-700/50 pb-3 flex items-center gap-2"><ImageIcon size={20}/> Identidade Visual</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Nome da Organização</label>
                        <input type="text" value={settings.gremioName} onChange={e => setSettings({...settings, gremioName: e.target.value})} className="w-full p-4 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-700/50 rounded-xl outline-none focus:border-blue-500 transition-colors font-medium" />
                      </div>
                      <div>
                        <label className="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Nome do Evento Atual</label>
                        <input type="text" value={settings.eventName} onChange={e => setSettings({...settings, eventName: e.target.value})} className="w-full p-4 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-700/50 rounded-xl outline-none focus:border-blue-500 transition-colors font-medium" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">URL da Logo (Imagem)</label>
                      <input type="url" value={settings.logoUrl} onChange={e => setSettings({...settings, logoUrl: e.target.value})} className="w-full p-4 bg-white/50 dark:bg-gray-900/50 border border-gray-300/50 dark:border-gray-700/50 rounded-xl outline-none focus:border-blue-500 transition-colors font-medium" />
                    </div>
                  </div>

                  {/* Gerenciamento de Eventos (Logs) */}
                  <div className="glass-panel rounded-3xl shadow-sm border border-gray-200/80 dark:border-gray-800 p-8">
                     <h3 className="font-black text-lg border-b border-gray-200/50 dark:border-gray-700/50 pb-3 mb-5 flex items-center gap-2"><Archive size={20}/> Gestão de Fechamento</h3>
                     <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 font-medium leading-relaxed">
                       Finalizou o evento de hoje? Arquive as vendas para limpar o caixa e guardar os registros no histórico de maneira segura.
                     </p>
                     <button onClick={() => {
                        if(sales.length === 0) return setAlertDialog({isOpen: true, title: 'Aviso', text: 'Não há vendas neste evento para arquivar.'});
                        setConfirmDialog({
                          isOpen: true, title: 'Arquivar Evento', text: `Deseja encerrar o evento "${settings.eventName}" e salvar os logs? O caixa será zerado para o próximo evento.`, isDanger: false,
                          action: () => {
                            const newLog = {
                              id: Date.now().toString(),
                              eventName: settings.eventName,
                              date: new Date().toISOString(),
                              totalSales: getReport(sales).total,
                              salesCount: sales.length,
                              salesData: [...sales]
                            };
                            setEventLogs([newLog, ...eventLogs]);
                            setSales([]);
                            setCashDrawer(defaultDrawer);
                            setSettings({...settings, eventName: 'Novo Evento'});
                            setAlertDialog({isOpen: true, title: 'Sucesso', text: 'Evento salvo nos logs e caixa zerado com sucesso!'});
                          }
                        });
                     }} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-2 w-full md:w-auto transition-all shadow-lg hover:shadow-blue-500/30">
                       <Archive size={20}/> Encerrar Evento e Arquivar
                     </button>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
