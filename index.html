<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grêmio Financeiro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0f1220;
  --panel:#171a2b;
  --text:#fff;
  --muted:#a0a0a0;
  --primary:#4f7cff;
  --danger:#ff4f4f;
  --success:#2ecc71;
}

.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --text:#111;
  --muted:#555;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;}

.sidebar{
  width:240px;
  background:var(--panel);
  padding:20px;
}

.sidebar h2{margin-bottom:20px;}
.menu button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  border-radius:8px;
}
.menu button:hover{background:var(--primary);}

.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.card{
  background:var(--panel);
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--primary);
  color:#fff;
}

.btn.danger{background:var(--danger);}
.btn.success{background:var(--success);}

#popup{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup-box{
  background:var(--panel);
  padding:20px;
  border-radius:10px;
  width:300px;
}

.product{
  padding:10px;
  background:var(--bg);
  margin:5px 0;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>💰 Grêmio</h2>

  <div class="menu">
    <button onclick="show('caixa')">Caixa</button>
    <button onclick="show('produtos')">Produtos</button>
    <button onclick="show('relatorios')">Relatórios</button>
    <button onclick="show('config')">Configurações</button>
  </div>

  <button class="btn" onclick="toggleTheme()">Tema</button>
</div>

<div class="main">

<!-- CAIXA -->
<div id="caixa" class="page">
  <h2>Caixa</h2>

  <div class="grid">
    <div class="card">
      <h3>Produtos</h3>
      <div id="listaProdutos"></div>
    </div>

    <div class="card">
      <h3>Carrinho</h3>
      <div id="carrinho"></div>
      <h3>Total: R$ <span id="total">0</span></h3>
      <button class="btn success" onclick="finalizar()">Finalizar Venda</button>
    </div>
  </div>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="page" style="display:none">
  <h2>Produtos</h2>

  <input id="nome" placeholder="Nome">
  <input id="preco" type="number" placeholder="Preço">

  <button class="btn" onclick="addProduto()">Adicionar</button>

  <div id="listaProd"></div>
</div>

<!-- RELATORIOS -->
<div id="relatorios" class="page" style="display:none">
  <h2>Relatórios</h2>
  <div class="card">
    <p>Total vendas: <span id="totalVendas">0</span></p>
  </div>
</div>

<!-- CONFIG -->
<div id="config" class="page" style="display:none">
  <h2>Configurações</h2>

  <input id="nomeGremio" placeholder="Nome do Grêmio">
  <button class="btn" onclick="salvarConfig()">Salvar</button>
</div>

</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <h3 id="popupTitle"></h3>
    <p id="popupText"></p>
    <button class="btn" onclick="closePopup()">OK</button>
  </div>
</div>

<script type="module">
// ================= FIREBASE =================
// coloque sua config aqui
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_ID",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= DADOS =================
let produtos = [];
let carrinho = [];
let total = 0;

// ================= NAV =================
window.show = (page)=>{
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById(page).style.display='block';
}

// ================= POPUP =================
function popup(t,txt){
  document.getElementById("popupTitle").innerText=t;
  document.getElementById("popupText").innerText=txt;
  document.getElementById("popup").style.display="flex";
}
window.closePopup=()=>popupHide();
function popupHide(){
  document.getElementById("popup").style.display="none";
}

// ================= PRODUTOS =================
window.addProduto=()=>{
  let nome=document.getElementById("nome").value;
  let preco=document.getElementById("preco").value;

  let p={nome,preco:Number(preco)};
  produtos.push(p);
  renderProdutos();
}

function renderProdutos(){
  let div=document.getElementById("listaProdutos");
  let div2=document.getElementById("listaProd");

  div.innerHTML="";
  div2.innerHTML="";

  produtos.forEach((p,i)=>{
    div.innerHTML+=`
      <div class='product' onclick='addCarrinho(${i})'>
        ${p.nome} - R$ ${p.preco}
      </div>`;

    div2.innerHTML+=`
      <div class='card'>
        ${p.nome} - R$ ${p.preco}
      </div>`;
  });
}

// ================= CARRINHO =================
window.addCarrinho=(i)=>{
  carrinho.push(produtos[i]);
  total+=produtos[i].preco;
  renderCarrinho();
}

function renderCarrinho(){
  let div=document.getElementById("carrinho");
  div.innerHTML="";

  carrinho.forEach(c=>{
    div.innerHTML+=`<div>${c.nome} - R$ ${c.preco}</div>`;
  });

  document.getElementById("total").innerText=total;
}

// ================= FINALIZAR =================
window.finalizar=async()=>{
  await addDoc(collection(db,"vendas"),{
    carrinho,
    total,
    data:new Date()
  });

  popup("Venda","Venda registrada com sucesso!");
  carrinho=[];
  total=0;
  renderCarrinho();
}

// ================= CONFIG =================
window.salvarConfig=()=>{
  popup("Configuração","Salvo com sucesso!");
}

// ================= THEME =================
window.toggleTheme=()=>{
  document.body.classList.toggle("light");
}

// INIT
renderProdutos();

</script>

</body>
</html>
