<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV - Interface Animada</title>

  <!-- 1. Importmap: Resolve o erro de "react/jsx-runtime" no console -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime"
      }
    }
  </script>

  <!-- 2. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 3. Configuração de Animações do Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.4s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <!-- 4. Babel Standalone: Permite rodar JSX diretamente no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-800 text-white min-h-screen flex items-center justify-center">

  <!-- Onde o React vai ser renderizado -->
  <div id="root"></div>

  <!-- 5. Script Principal do React -->
  <script type="text/babel" data-type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';

    // Componente do Pop-up Animado (Dark Mode + Glassmorphism)
    const AnimatedPopup = ({ titulo, mensagem, isOpen, onClose }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in z-50">
          <div className="bg-gray-900 text-white p-6 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)] border border-gray-700 w-96 transform animate-slide-up transition-all">
            <h3 className="text-xl font-bold mb-3 text-blue-400">{titulo}</h3>
            <p className="mb-6 text-gray-300">{mensagem}</p>
            
            <div className="flex justify-end">
              <button
                onClick={onClose}
                className="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg transition-colors shadow-lg shadow-blue-500/30"
              >
                Confirmar
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Componente Principal da Aplicação
    const App = () => {
      // Estado que controla se o popup está visível ou não
      const [isPopupOpen, setIsPopupOpen] = useState(false);

      return (
        <div className="text-center">
          <h1 className="text-3xl font-bold mb-8 text-gray-100">Painel do PDV</h1>
          
          {/* Botão que ativa o popup com efeito de hover (scale) */}
          <button 
            onClick={() => setIsPopupOpen(true)}
            className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-emerald-500/30 transition-all transform hover:scale-105"
          >
            Abrir Alerta Animado
          </button>

          {/* O Pop-up sendo chamado na tela */}
          <AnimatedPopup 
            titulo="Ação Realizada!" 
            mensagem="Sua configuração foi salva com sucesso no sistema. O visual está muito mais fluido e profissional agora."
            isOpen={isPopupOpen} 
            onClose={() => setIsPopupOpen(false)} 
          />
        </div>
      );
    };

    // Inicia o React e renderiza o App dentro da div #root
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
