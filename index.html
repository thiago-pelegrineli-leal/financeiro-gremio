<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ESTA É A LINHA QUE VOCÊ VAI ADICIONAR -->
  <link rel="icon" type="image/png" href="https://media-gru1-1.cdn.whatsapp.net/v/t61.24694-24/489405406_650586094569182_6793834854762065392_n.jpg?ccb=11-4&oh=01_Q5Aa4wGY7p0SayjbDIPzs9zg4cRQqjwpuZWHtXDXiacRVfJnLw&oe=6A35BF57&_nc_sid=5e03e0&_nc_cat=102">
  
  <title>PDV Profissional</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ... resto do código ... -->
  <title>PDV Profissional</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18.2.0"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      ShoppingCart, Settings, FileText, Plus, Trash2, Edit2, 
      CreditCard, Banknote, CheckCircle, PlusCircle, MinusCircle, 
      AlertTriangle, Moon, Sun, Printer, History, Tag, RotateCcw,
      LayoutDashboard, Store, X
    } from 'lucide-react';

    function App() {
      // --- ESTADOS BASE E ARMAZENAMENTO LOCAL ---
      
      const loadData = (key, defaultValue) => {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : defaultValue;
      };

      const [theme, setTheme] = useState(() => loadData('pdv_theme', 'light'));
      const [settings, setSettings] = useState(() => loadData('pdv_settings', { eventName: 'Grêmio Estudantil' }));
      const [products, setProducts] = useState(() => loadData('pdv_products', []));
      const [sales, setSales] = useState(() => loadData('pdv_sales', []));
      
      const [activeTab, setActiveTab] = useState('pos'); 
      const [cart, setCart] = useState([]);
      const [cartDiscount, setCartDiscount] = useState(0);

      // Estados de formulário Produto
      const [editingProduct, setEditingProduct] = useState(null);
      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      
      // Feedback
      const [checkoutMsg, setCheckoutMsg] = useState('');

      // Estados do Modal PIX
      const [isPixModalOpen, setIsPixModalOpen] = useState(false);
      const [pixStudentName, setPixStudentName] = useState('');
      const [pixStudentClass, setPixStudentClass] = useState('');

      // Salva automaticamente quando os dados mudam
      useEffect(() => { localStorage.setItem('pdv_theme', JSON.stringify(theme)); }, [theme]);
      useEffect(() => { localStorage.setItem('pdv_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('pdv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('pdv_sales', JSON.stringify(sales)); }, [sales]);

      // Alterna o tema no HTML
      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      // --- UTILITÁRIOS ---
      const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const formatDate = (isoString) => new Date(isoString).toLocaleString('pt-BR');

      // --- LÓGICA DO PDV ---
      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === product.id);
          if (exists) return prev.map(i => i.product.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { product, quantity: 1 }];
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === productId);
          if (exists.quantity === 1) return prev.filter(i => i.product.id !== productId);
          return prev.map(i => i.product.id === productId ? { ...i, quantity: i.quantity - 1 } : i);
        });
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      const cartTotal = Math.max(0, cartSubtotal - cartDiscount);

      // Ação quando clica no botão PIX
      const handlePixClick = () => {
        if (cart.length === 0) return;
        setIsPixModalOpen(true); // Abre o modal para coletar os dados
      };

      // Confirmação final da venda (serve tanto pro modal PIX quanto botão Dinheiro)
      const processCheckout = (paymentMethod) => {
        if (cart.length === 0) return;

        // Se for PIX, garante que preencheu o modal
        if (paymentMethod === 'PIX' && (!pixStudentName.trim() || !pixStudentClass.trim())) {
          alert("Por favor, preencha o Nome e a Série do aluno.");
          return;
        }

        const newSale = {
          id: Date.now().toString(),
          items: [...cart],
          subtotal: cartSubtotal,
          discount: cartDiscount,
          total: cartTotal,
          paymentMethod,
          timestamp: new Date().toISOString(),
          // Adiciona os dados do aluno apenas se for PIX
          studentInfo: paymentMethod === 'PIX' ? {
            name: pixStudentName,
            schoolClass: pixStudentClass
          } : null
        };

        setSales([newSale, ...sales]);
        setCart([]);
        setCartDiscount(0);
        
        // Limpa estados do modal e fecha
        setPixStudentName('');
        setPixStudentClass('');
        setIsPixModalOpen(false);

        setCheckoutMsg(`Sucesso! ${formatCurrency(cartTotal)} via ${paymentMethod}`);
        setTimeout(() => setCheckoutMsg(''), 3000);
      };

      const cancelSale = (saleId) => {
        if(window.confirm("Tem certeza que deseja estornar (cancelar) esta venda?")) {
          setSales(sales.filter(s => s.id !== saleId));
        }
      };

      // --- LÓGICA DE PRODUTOS ---
      const saveProduct = (e) => {
        e.preventDefault();
        if (!prodName || !prodPrice) return;
        
        const priceNum = parseFloat(prodPrice.toString().replace(',', '.'));

        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? { ...p, name: prodName, price: priceNum } : p));
          setEditingProduct(null);
        } else {
          setProducts([...products, { id: Date.now().toString(), name: prodName, price: priceNum }]);
        }
        setProdName('');
        setProdPrice('');
      };

      const editProduct = (prod) => {
        setEditingProduct(prod);
        setProdName(prod.name);
        setProdPrice(prod.price);
        setActiveTab('products');
      };

      const deleteProduct = (id) => {
        if(window.confirm("Excluir este produto do cardápio?")) {
          setProducts(products.filter(p => p.id !== id));
          setCart(cart.filter(item => item.product.id !== id));
        }
      };

      // --- RELATÓRIOS ---
      const getReport = () => {
        return sales.reduce((acc, sale) => {
          acc.total += sale.total;
          acc.discounts += sale.discount || 0;
          if (sale.paymentMethod === 'PIX') acc.pix += sale.total;
          if (sale.paymentMethod === 'DINHEIRO') acc.dinheiro += sale.total;

          sale.items.forEach(item => {
            if (!acc.items[item.product.id]) {
              acc.items[item.product.id] = { name: item.product.name, quantity: 0, total: 0 };
            }
            acc.items[item.product.id].quantity += item.quantity;
            acc.items[item.product.id].total += (item.quantity * item.product.price);
          });
          return acc;
        }, { total: 0, pix: 0, dinheiro: 0, discounts: 0, items: {} });
      };

      const handlePrint = () => window.print();

      // --- COMPONENTES ---
      const NavItem = ({ id, icon: Icon, label }) => (
        <button
          onClick={() => setActiveTab(id)}
          className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 font-medium ${
            activeTab === id 
              ? 'bg-blue-600 text-white shadow-md' 
              : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'
          }`}
        >
          <Icon size={20} /> <span className="hidden md:block">{label}</span>
        </button>
      );

      const reportData = getReport();

      return (
        <div className={`min-h-screen flex transition-colors duration-300 ${theme === 'dark' ? 'dark bg-gray-950' : 'bg-gray-100'}`}>
          
          {/* SIDEBAR */}
          <aside className="w-20 md:w-64 bg-white dark:bg-gray-900 border-r dark:border-gray-800 flex flex-col p-4 shadow-sm print:hidden transition-all duration-300 z-10">
            <div className="flex items-center gap-3 px-2 mb-8 mt-2 text-blue-600 dark:text-blue-500">
              <Store size={32} className="shrink-0" />
              <h1 className="text-xl font-bold tracking-tight hidden md:block overflow-hidden text-ellipsis whitespace-nowrap">
                {settings.eventName}
              </h1>
            </div>

            <nav className="flex-1 space-y-2">
              <NavItem id="pos" icon={ShoppingCart} label="Caixa (PDV)" />
              <NavItem id="products" icon={Tag} label="Cardápio" />
              <NavItem id="history" icon={History} label="Histórico" />
              <NavItem id="report" icon={LayoutDashboard} label="Relatório" />
            </nav>

            <div className="mt-auto space-y-2 pt-4 border-t dark:border-gray-800">
              <NavItem id="settings" icon={Settings} label="Configurações" />
              <button 
                onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              >
                {theme === 'dark' ? <Sun size={20}/> : <Moon size={20}/>}
                <span className="hidden md:block font-medium">Tema {theme === 'dark' ? 'Claro' : 'Escuro'}</span>
              </button>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:overflow-visible relative">
            
            {/* Modal PIX (Sobreposto) */}
            {isPixModalOpen && (
              <div className="absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm print:hidden">
                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                  <div className="flex justify-between items-center p-4 border-b dark:border-gray-700 bg-teal-50 dark:bg-teal-900/30">
                    <h3 className="font-bold text-teal-800 dark:text-teal-400 flex items-center gap-2">
                      <CreditCard size={20} /> Identificação do PIX
                    </h3>
                    <button onClick={() => setIsPixModalOpen(false)} className="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                      <X size={20} />
                    </button>
                  </div>
                  
                  <div className="p-6 space-y-4">
                    <div className="text-center mb-6">
                      <p className="text-sm text-gray-500 dark:text-gray-400">Total a cobrar no PIX:</p>
                      <p className="text-3xl font-black text-teal-600 dark:text-teal-400">{formatCurrency(cartTotal)}</p>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Nome do Aluno</label>
                      <input 
                        type="text" 
                        value={pixStudentName} 
                        onChange={e => setPixStudentName(e.target.value)} 
                        placeholder="Ex: João da Silva" 
                        className="w-full p-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-600 rounded-xl text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-teal-500 outline-none"
                        autoFocus
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Série / Turma</label>
                      <input 
                        type="text" 
                        value={pixStudentClass} 
                        onChange={e => setPixStudentClass(e.target.value)} 
                        placeholder="Ex: 3º Ano B" 
                        className="w-full p-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-600 rounded-xl text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-teal-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="p-4 border-t dark:border-gray-700 flex gap-3 bg-gray-50 dark:bg-gray-800/80">
                    <button 
                      onClick={() => setIsPixModalOpen(false)}
                      className="flex-1 py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                    >
                      Cancelar
                    </button>
                    <button 
                      onClick={() => processCheckout('PIX')}
                      disabled={!pixStudentName.trim() || !pixStudentClass.trim()}
                      className="flex-1 py-3 bg-teal-500 text-white rounded-xl font-bold hover:bg-teal-600 disabled:opacity-50 transition-colors flex justify-center items-center gap-2"
                    >
                      <CheckCircle size={20}/> Confirmar Venda
                    </button>
                  </div>
                </div>
              </div>
            )}

            <header className="bg-white dark:bg-gray-900 border-b dark:border-gray-800 p-4 shadow-sm print:hidden flex justify-between items-center md:hidden">
              <h1 className="font-bold text-gray-800 dark:text-white truncate">{settings.eventName}</h1>
            </header>

            <div className="flex-1 overflow-y-auto p-4 md:p-6 print:p-0">
              
              {/* ================= ABA: CAIXA (PDV) ================= */}
              {activeTab === 'pos' && (
                <div className="flex flex-col lg:flex-row gap-6 h-full print:hidden">
                  {/* Grid de Produtos */}
                  <div className="flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100">Frente de Caixa</h2>
                      <span className="text-sm text-gray-500 dark:text-gray-400">{products.length} produtos</span>
                    </div>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pb-4 pr-2">
                      {products.map(p => (
                        <button
                          key={p.id}
                          onClick={() => addToCart(p)}
                          className="bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-blue-400 dark:hover:border-blue-500 transition-all active:scale-95 group"
                        >
                          <span className="font-semibold text-gray-800 dark:text-gray-200 mb-2 group-hover:text-blue-600 dark:group-hover:text-blue-400">{p.name}</span>
                          <span className="text-blue-700 dark:text-blue-300 font-bold bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-lg">
                            {formatCurrency(p.price)}
                          </span>
                        </button>
                      ))}
                      {products.length === 0 && (
                        <div className="col-span-full py-12 text-center bg-white dark:bg-gray-800 rounded-2xl border border-dashed dark:border-gray-700">
                          <p className="text-gray-500 dark:text-gray-400">Cardápio vazio.</p>
                          <button onClick={() => setActiveTab('products')} className="mt-2 text-blue-600 font-medium hover:underline">Ir para Produtos</button>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Carrinho */}
                  <div className="w-full lg:w-96 bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-2xl shadow-sm flex flex-col h-[600px] lg:h-full shrink-0">
                    <div className="p-4 border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 rounded-t-2xl">
                      <h3 className="text-lg font-bold text-gray-800 dark:text-white flex justify-between items-center">
                        Comanda Atual
                        <span className="bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs px-2 py-1 rounded-full">
                          {cart.reduce((sum, i) => sum + i.quantity, 0)} itens
                        </span>
                      </h3>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                      {cart.length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 space-y-2">
                          <ShoppingCart size={48} className="opacity-20" />
                          <p>Adicione itens para vender</p>
                        </div>
                      ) : (
                        cart.map(item => (
                          <div key={item.product.id} className="flex justify-between items-center bg-gray-50 dark:bg-gray-700/30 p-3 rounded-xl border dark:border-gray-700">
                            <div className="flex-1 pr-2">
                              <p className="font-semibold text-sm text-gray-800 dark:text-gray-200">{item.product.name}</p>
                              <p className="text-xs text-gray-500 dark:text-gray-400">{formatCurrency(item.product.price)}</p>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="flex items-center bg-white dark:bg-gray-800 rounded-lg border dark:border-gray-600 shadow-sm">
                                <button onClick={() => removeFromCart(item.product.id)} className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-l-lg transition-colors"><MinusCircle size={16}/></button>
                                <span className="w-6 text-center font-bold text-sm text-gray-800 dark:text-gray-200">{item.quantity}</span>
                                <button onClick={() => addToCart(item.product)} className="p-1.5 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-r-lg transition-colors"><PlusCircle size={16}/></button>
                              </div>
                              <div className="font-bold text-sm w-16 text-right text-gray-800 dark:text-gray-200">
                                {formatCurrency(item.product.price * item.quantity)}
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    {/* Área de Finalização */}
                    <div className="p-4 bg-gray-50 dark:bg-gray-800/80 border-t dark:border-gray-700 rounded-b-2xl">
                      
                      <div className="flex justify-between items-center mb-3">
                        <span className="text-sm font-medium text-gray-600 dark:text-gray-400">Desconto (R$):</span>
                        <input 
                          type="number" min="0" step="0.5" 
                          value={cartDiscount || ''} 
                          onChange={e => setCartDiscount(Number(e.target.value))}
                          className="w-24 text-right p-1 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100"
                          placeholder="0.00"
                        />
                      </div>

                      <div className="flex justify-between items-end mb-4">
                        <span className="text-gray-600 dark:text-gray-400 font-medium">Total a Pagar:</span>
                        <div className="text-right">
                          {cartDiscount > 0 && <span className="text-sm text-gray-400 line-through block">{formatCurrency(cartSubtotal)}</span>}
                          <span className="text-3xl font-black text-blue-600 dark:text-blue-400">{formatCurrency(cartTotal)}</span>
                        </div>
                      </div>

                      {checkoutMsg && (
                        <div className="mb-4 bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-300 p-3 rounded-xl text-sm font-medium flex items-center justify-center gap-2 animate-pulse">
                          <CheckCircle size={18} /> {checkoutMsg}
                        </div>
                      )}

                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => processCheckout('DINHEIRO')} disabled={cart.length===0} className="bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white py-3 rounded-xl font-bold flex flex-col items-center justify-center gap-1 transition-transform active:scale-95">
                          <Banknote size={20} /> <span className="text-xs">Dinheiro</span>
                        </button>
                        <button onClick={handlePixClick} disabled={cart.length===0} className="bg-teal-500 hover:bg-teal-600 disabled:opacity-50 text-white py-3 rounded-xl font-bold flex flex-col items-center justify-center gap-1 transition-transform active:scale-95">
                          <CreditCard size={20} /> <span className="text-xs">PIX</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ================= ABA: PRODUTOS ================= */}
              {activeTab === 'products' && (
                <div className="max-w-4xl mx-auto print:hidden">
                  <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Gerenciar Cardápio</h2>
                  
                  <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 overflow-hidden mb-8">
                    <div className="p-4 bg-blue-50 dark:bg-blue-900/20 border-b dark:border-gray-700">
                      <h3 className="font-semibold text-blue-800 dark:text-blue-300 flex items-center gap-2">
                        {editingProduct ? <Edit2 size={18}/> : <PlusCircle size={18}/>} 
                        {editingProduct ? 'Editando Produto' : 'Novo Produto'}
                      </h3>
                    </div>
                    <form onSubmit={saveProduct} className="p-5 flex flex-col md:flex-row gap-4 items-end">
                      <div className="flex-1 w-full">
                        <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Nome do Produto</label>
                        <input type="text" value={prodName} onChange={e => setProdName(e.target.value)} required placeholder="Ex: Refrigerante Lata" className="w-full p-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none" />
                      </div>
                      <div className="w-full md:w-40">
                        <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" min="0" value={prodPrice} onChange={e => setProdPrice(e.target.value)} required placeholder="0.00" className="w-full p-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none" />
                      </div>
                      <div className="flex gap-2 w-full md:w-auto">
                        {editingProduct && (
                          <button type="button" onClick={() => {setEditingProduct(null); setProdName(''); setProdPrice('');}} className="p-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                            Cancelar
                          </button>
                        )}
                        <button type="submit" className="flex-1 md:flex-none p-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                          <CheckCircle size={20} /> Salvar
                        </button>
                      </div>
                    </form>
                  </div>

                  <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 overflow-hidden">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-gray-50 dark:bg-gray-900/50 border-b dark:border-gray-700 text-gray-600 dark:text-gray-400 text-sm">
                          <th className="p-4 font-semibold">Produto</th>
                          <th className="p-4 font-semibold w-32">Preço</th>
                          <th className="p-4 font-semibold w-24 text-center">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y dark:divide-gray-700">
                        {products.map(p => (
                          <tr key={p.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                            <td className="p-4 font-medium text-gray-800 dark:text-gray-200">{p.name}</td>
                            <td className="p-4 font-bold text-green-600 dark:text-green-400">{formatCurrency(p.price)}</td>
                            <td className="p-4 flex justify-center gap-2">
                              <button onClick={() => editProduct(p)} className="p-2 text-blue-500 hover:bg-blue-100 dark:hover:bg-blue-900/30 rounded-lg"><Edit2 size={18}/></button>
                              <button onClick={() => deleteProduct(p.id)} className="p-2 text-red-500 hover:bg-red-100 dark:hover:bg-red-900/30 rounded-lg"><Trash2 size={18}/></button>
                            </td>
                          </tr>
                        ))}
                        {products.length === 0 && <tr><td colSpan="3" className="p-8 text-center text-gray-500">Nenhum produto cadastrado.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ================= ABA: HISTÓRICO DE VENDAS ================= */}
              {activeTab === 'history' && (
                <div className="max-w-4xl mx-auto print:hidden">
                  <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Histórico de Transações</h2>
                  
                  <div className="space-y-4">
                    {sales.length === 0 ? (
                      <div className="p-8 text-center bg-white dark:bg-gray-800 rounded-2xl border dark:border-gray-700 text-gray-500">Nenhuma venda registrada no evento atual.</div>
                    ) : (
                      sales.map(sale => (
                        <div key={sale.id} className="bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-2xl p-5 flex flex-col md:flex-row gap-4 justify-between items-start md:items-center shadow-sm">
                          <div>
                            <div className="flex flex-wrap items-center gap-3 mb-2">
                              <span className={`px-2 py-1 rounded text-xs font-bold ${
                                sale.paymentMethod === 'PIX' ? 'bg-teal-100 text-teal-800 dark:bg-teal-900 dark:text-teal-200' :
                                'bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200'
                              }`}>
                                {sale.paymentMethod}
                              </span>
                              <span className="text-sm text-gray-500 dark:text-gray-400">{formatDate(sale.timestamp)}</span>
                              
                              {/* Exibe Nome e Série se for PIX */}
                              {sale.studentInfo && (
                                <span className="text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-2 py-1 rounded-md flex items-center gap-1 border dark:border-gray-600">
                                  👤 {sale.studentInfo.name} ({sale.studentInfo.schoolClass})
                                </span>
                              )}
                            </div>
                            <p className="text-sm text-gray-600 dark:text-gray-300">
                              {sale.items.map(i => `${i.quantity}x ${i.product.name}`).join(' • ')}
                            </p>
                            {sale.discount > 0 && <p className="text-xs text-red-500 mt-1">Desconto aplicado: {formatCurrency(sale.discount)}</p>}
                          </div>
                          
                          <div className="flex items-center gap-4 w-full md:w-auto justify-between border-t md:border-0 pt-3 md:pt-0 dark:border-gray-700">
                            <span className="text-xl font-black text-gray-800 dark:text-gray-100">{formatCurrency(sale.total)}</span>
                            <button onClick={() => cancelSale(sale.id)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-xl flex items-center gap-2 text-sm font-semibold transition-colors" title="Estornar/Cancelar Venda">
                              <RotateCcw size={16} /> Estornar
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* ================= ABA: RELATÓRIO ================= */}
              {(activeTab === 'report') && (
                <div className="max-w-4xl mx-auto">
                  <div className="hidden print:block text-center mb-8 border-b-2 border-black pb-4">
                    <h1 className="text-3xl font-black uppercase">{settings.eventName}</h1>
                    <p className="text-xl mt-1">Fechamento de Caixa</p>
                    <p className="text-sm mt-2 text-gray-600">Impresso em: {formatDate(new Date().toISOString())}</p>
                  </div>

                  <div className="flex justify-between items-center mb-6 print:hidden">
                    <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100">Visão Geral</h2>
                    <button onClick={handlePrint} className="bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-900 px-4 py-2 rounded-xl font-bold flex items-center gap-2 hover:bg-gray-700 dark:hover:bg-white transition-colors shadow-sm">
                      <Printer size={18} /> Imprimir Relatório
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-l-4 border-l-blue-500 dark:border-gray-700">
                      <p className="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Faturamento Bruto</p>
                      <p className="text-2xl font-black text-gray-800 dark:text-white print:text-black">{formatCurrency(reportData.total)}</p>
                    </div>
                    <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-l-4 border-l-teal-500 dark:border-gray-700">
                      <p className="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Total PIX</p>
                      <p className="text-2xl font-black text-gray-800 dark:text-white print:text-black">{formatCurrency(reportData.pix)}</p>
                    </div>
                    <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-l-4 border-l-emerald-500 dark:border-gray-700">
                      <p className="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Total Dinheiro</p>
                      <p className="text-2xl font-black text-gray-800 dark:text-white print:text-black">{formatCurrency(reportData.dinheiro)}</p>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 overflow-hidden print:border-black print:shadow-none">
                    <div className="p-4 bg-gray-50 dark:bg-gray-900 border-b dark:border-gray-700 print:bg-white print:border-black">
                      <h3 className="text-lg font-bold text-gray-800 dark:text-gray-100 print:text-black">Quantidades Vendidas</h3>
                    </div>
                    <table className="w-full text-left">
                      <thead className="text-xs uppercase text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 border-b dark:border-gray-700">
                        <tr>
                          <th className="p-4">Produto</th>
                          <th className="p-4 text-center">Qtd</th>
                          <th className="p-4 text-right">Receita</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y dark:divide-gray-700 print:text-black">
                        {Object.values(reportData.items)
                          .sort((a, b) => b.quantity - a.quantity)
                          .map((item, idx) => (
                            <tr key={idx}>
                              <td className="p-4 font-medium text-gray-800 dark:text-gray-200 print:text-black">{item.name}</td>
                              <td className="p-4 text-center font-bold text-blue-600 dark:text-blue-400 print:text-black">{item.quantity}</td>
                              <td className="p-4 text-right font-medium text-gray-600 dark:text-gray-300 print:text-black">{formatCurrency(item.total)}</td>
                            </tr>
                        ))}
                        {Object.keys(reportData.items).length === 0 && <tr><td colSpan="3" className="p-8 text-center text-gray-500">Nenhuma venda registrada.</td></tr>}
                      </tbody>
                    </table>
                    <div className="p-4 bg-gray-50 dark:bg-gray-900 border-t dark:border-gray-700 text-sm text-gray-600 dark:text-gray-400 print:bg-white print:border-black print:text-black text-right">
                      Descontos concedidos: <strong className="text-red-500">{formatCurrency(reportData.discounts)}</strong>
                    </div>
                  </div>
                  
                  {/* Seção Nova no Relatório: Lista de Pix para Conferência */}
                  <div className="mt-8 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 overflow-hidden print:border-black print:shadow-none print:mt-4">
                    <div className="p-4 bg-teal-50 dark:bg-teal-900/30 border-b dark:border-gray-700 print:bg-white print:border-black">
                      <h3 className="text-lg font-bold text-teal-800 dark:text-teal-400 print:text-black">Conferência de PIX</h3>
                    </div>
                    <div className="p-4">
                      <ul className="space-y-2 text-sm text-gray-700 dark:text-gray-300 print:text-black">
                        {sales.filter(s => s.paymentMethod === 'PIX').length === 0 ? (
                          <li className="text-gray-500">Nenhum pagamento via PIX registrado.</li>
                        ) : (
                          sales.filter(s => s.paymentMethod === 'PIX').map(sale => (
                            <li key={sale.id} className="flex justify-between border-b dark:border-gray-700 pb-2 print:border-black">
                              <span><strong>{sale.studentInfo?.name}</strong> ({sale.studentInfo?.schoolClass})</span>
                              <span className="font-bold">{formatCurrency(sale.total)}</span>
                            </li>
                          ))
                        )}
                      </ul>
                    </div>
                  </div>

                  <div className="hidden print:block mt-16 text-center text-sm text-gray-600">
                    <p>_________________________________________________</p>
                    <p className="mt-2">Assinatura do Responsável</p>
                  </div>
                </div>
              )}

              {/* ================= ABA: CONFIGURAÇÕES ================= */}
              {activeTab === 'settings' && (
                <div className="max-w-2xl mx-auto print:hidden space-y-6">
                  <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Configurações do Sistema</h2>
                  
                  <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 p-6">
                    <h3 className="font-bold text-gray-800 dark:text-white mb-4">Informações do Evento</h3>
                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Nome do Grêmio ou Evento</label>
                    <input 
                      type="text" 
                      value={settings.eventName} 
                      onChange={e => setSettings({...settings, eventName: e.target.value})}
                      className="w-full p-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-600 rounded-xl text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>

                  <div className="bg-red-50 dark:bg-red-900/20 rounded-2xl shadow-sm border border-red-200 dark:border-red-800/50 p-6">
                    <h3 className="font-bold text-red-800 dark:text-red-400 mb-2 flex items-center gap-2"><AlertTriangle size={20}/> Zona de Perigo</h3>
                    <p className="text-sm text-red-600 dark:text-red-300 mb-4">Ao encerrar o evento, todo o histórico de vendas será apagado.</p>
                    <button 
                      onClick={() => {
                        if(window.confirm(`Você tem certeza absoluta?\nIsso apagará as ${sales.length} vendas registradas.`)){
                          setSales([]);
                          setActiveTab('pos');
                        }
                      }}
                      className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition-colors"
                    >
                      Encerrar Evento (Zerar Vendas)
                    </button>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    // Renderizando a aplicação
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
